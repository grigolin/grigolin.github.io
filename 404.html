<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not found · Guilherme Grigolin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ececea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<!-- GitHub Pages serves this file for any missing path, at any depth: every URL here must be absolute. -->
<script>/* saved theme + language before first paint (shared with every view) */try{var th=localStorage.getItem('theme');if(th==='light'||th==='dark')document.documentElement.dataset.theme=th}catch(e){}try{var l=localStorage.getItem('lang');if(l==='"pt"'||l==='pt')document.documentElement.lang='pt-BR'}catch(e){}</script>
<link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Geist (SIL OFL 1.1), self-hosted: one variable file covers weights 400–600 */
@font-face{font-family:Geist;font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/geist-latin.woff2) format('woff2')}
/* Layout: the Garden's single column, with the Desk's Valley as the header. */
:root{
  --bg:#ececea; --card:#f8f8f6; --fg:#1b1b1a; --mid:#686864; --line:rgba(0,0,0,.07); --acc:#3a6df0;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 1px 2px rgba(0,0,0,.05),0 6px 16px -8px rgba(0,0,0,.12);
  --sans:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d0d0d; --card:#171717; --fg:#ededed; --mid:#8c8c8c; --line:rgba(255,255,255,.07); --acc:#7aa2ff;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 6px 20px -8px rgba(0,0,0,.6); color-scheme:dark;
}}:root[data-theme=dark]{
  --bg:#0d0d0d; --card:#171717; --fg:#ededed; --mid:#8c8c8c; --line:rgba(255,255,255,.07); --acc:#7aa2ff;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 6px 20px -8px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:40px max(20px,env(safe-area-inset-right)) 96px max(20px,env(safe-area-inset-left))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--mid)}
.top a{display:inline-flex;align-items:center;gap:6px;transition:color .2s}
.top a:hover{color:var(--fg)}
.prefs{display:inline-flex;align-items:center;gap:8px}
.themebtn{all:unset;cursor:pointer;position:relative;width:28px;height:28px;border-radius:999px;display:grid;place-items:center;color:var(--mid);transition:background .2s,color .2s,transform .15s}
.themebtn:hover{background:var(--card);color:var(--fg)}
.themebtn:active{transform:scale(.9)}
.themebtn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.themebtn svg{grid-area:1/1;width:16px;height:16px;transition:transform .5s cubic-bezier(.2,.9,.25,1.08),opacity .25s}
.themebtn .moon{opacity:0;transform:rotate(-70deg) scale(.4)}
:root[data-theme=dark] .themebtn .sun{opacity:0;transform:rotate(70deg) scale(.4)}
:root[data-theme=dark] .themebtn .moon{opacity:1;transform:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .themebtn .sun{opacity:0;transform:rotate(70deg) scale(.4)}:root:not([data-theme=light]) .themebtn .moon{opacity:1;transform:none}}
.themebtn .auto{position:absolute;right:3px;bottom:3px;width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--bg);transform:scale(0);transition:transform .3s cubic-bezier(.2,.9,.25,1.08)}
.themebtn[data-auto="true"] .auto{transform:none}
html.theming::view-transition-old(root){animation:none}
html.theming::view-transition-new(root){animation:theme-reveal .6s cubic-bezier(.4,0,.2,1) both}
@keyframes theme-reveal{from{clip-path:circle(0 at var(--tx) var(--ty))}to{clip-path:circle(var(--tr) at var(--tx) var(--ty))}}
.seg{display:inline-flex;padding:2px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.seg button{all:unset;cursor:pointer;height:24px;min-width:34px;padding:0 9px;display:grid;place-items:center;border-radius:999px;font:500 12px/1 var(--sans);color:var(--mid);transition:color .2s,background .2s}
.seg button[aria-pressed="true"]{color:var(--fg);background:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--acc)}

/* ---------- the valley (same engravings and behaviour as the Desk tile) ---------- */
.valley{position:relative;height:max(150px,calc(min(100vw - 40px,680px) / 4 + 46px));margin:56px 0 32px;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:var(--card)}
.valley:has(.stage:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
.valley .stage{all:unset;position:absolute;inset:0;display:block;background:#f7f4ec;cursor:crosshair}
.valley .land{position:absolute;inset:34px 0 0;background:url(/images/bg2.webp) center bottom/100% auto no-repeat;mix-blend-mode:multiply;opacity:.95;pointer-events:none}
.valley .sp{position:absolute;background:url(/images/entities.png) no-repeat;transform-origin:0 0;transform:scale(.5);mix-blend-mode:multiply;pointer-events:none;animation:pop .5s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.5) translateY(12px)}}
.valley .stage::after{content:"";position:absolute;inset:0;background:linear-gradient(#f7f4ec 0,transparent 40%);pointer-events:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .valley .stage{filter:invert(.91) hue-rotate(180deg)}}:root[data-theme=dark] .valley .stage{filter:invert(.91) hue-rotate(180deg)}
.valley .head{position:absolute;top:20px;left:20px;right:20px;z-index:2;display:flex;justify-content:space-between;pointer-events:none;font:500 13px/16px var(--sans);letter-spacing:-.005em;color:#6f6a5e}
.valley .head .num{font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .valley .head{color:#9a958a}}:root[data-theme=dark] .valley .head{color:#9a958a}

h1{margin:0;font-size:34px;font-weight:600;letter-spacing:-.035em;line-height:1.1;text-wrap:balance}
.lede{margin:10px 0 0;color:var(--mid);font-size:17px;max-width:46ch;letter-spacing:-.01em;text-wrap:pretty}
.path{margin:18px 0 0;font:400 13px/1.4 var(--mono);color:var(--mid);overflow-wrap:anywhere}
.path b{font-weight:400;color:var(--fg)}
nav.go{display:flex;gap:6px;flex-wrap:wrap;margin-top:28px}
nav.go a{height:30px;padding:0 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mid);transition:color .2s,transform .2s}
nav.go a:hover{color:var(--fg);transform:translateY(-1px)}
nav.go a:first-child{color:var(--fg)}
nav.go .ic{font:500 12px/1 var(--mono)}
footer{margin-top:64px;color:var(--mid);font-size:12.5px}
@media (max-width:520px){.valley{margin-top:40px}h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@view-transition{navigation:auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="/" data-i="back">← grigolin.org</a>
    <div class="prefs">
    <button class="themebtn" id="themeBtn" type="button" aria-label="Theme"><svg class="sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.3M8 13.2v1.3M1.5 8h1.3M13.2 8h1.3M3.4 3.4l.9.9M11.7 11.7l.9.9M3.4 12.6l.9-.9M11.7 4.3l.9-.9"/></svg><svg class="moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 9.6A5.6 5.6 0 0 1 6.4 2.5a5.6 5.6 0 1 0 7.1 7.1z"/></svg><span class="auto" aria-hidden="true"></span></button>
    <div class="seg" id="lang" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true" aria-label="EN, English">EN</button><button type="button" data-lang="pt" aria-pressed="false" aria-label="PT, Português">PT</button></div>
    </div>
  </div>

  <main>
    <div class="valley">
      <button class="stage" id="vl" type="button" data-i-aria="build" aria-label="Build in the valley"><span class="land"></span></button>
      <div class="head" aria-hidden="true"><span>404</span><span class="num" id="vlc">Click to build</span></div>
    </div>
    <h1 data-i="title">This page isn’t on the map.</h1>
    <p class="lede" data-i="lede">The link may be old or mistyped. Nothing was ever built here, but the valley is open: click it and settle a house, a tree or a church.</p>
    <p class="path" id="path" hidden></p>
    <nav class="go" aria-label="Pages">
      <a href="/"><span class="ic" aria-hidden="true">▦</span><span data-i="desk">Desk</span></a>
      <a href="/terminal/"><span class="ic" aria-hidden="true">&gt;_</span><span data-i="terminal">Terminal</span></a>
      <a href="/desktop/"><span class="ic" aria-hidden="true">▣</span><span data-i="desktop">Desktop</span></a>
      <a href="/garden/"><span class="ic" aria-hidden="true">✿</span><span data-i="garden">Garden</span></a>
    </nav>
  </main>
  <footer data-i="foot">Engravings from the original grigolin.org.</footer>
</div>

<script>
const I18N = {
  en: { back: '← grigolin.org', title: 'This page isn’t on the map.',
        lede: 'The link may be old or mistyped. Nothing was ever built here, but the valley is open: click it and settle a house, a tree or a church.',
        path: 'Nothing at', desk: 'Desk', terminal: 'Terminal', desktop: 'Desktop', garden: 'Garden', foot: 'Engravings from the original grigolin.org.',
        build: 'Build in the valley', hint: 'Click to build', n: (n) => `${n} built`,
        toDark: 'Switch to dark theme', toLight: 'Switch to light theme', auto: 'following your device', manual: 'chosen by you. Click again to follow your device', dark: 'Dark', light: 'Light' },
  pt: { back: '← grigolin.org', title: 'Esta página não está no mapa.',
        lede: 'O link pode ser antigo ou ter um erro de digitação. Nada foi construído aqui, mas o vale está livre: clique nele e erga uma casa, uma árvore ou uma igreja.',
        path: 'Nada em', desk: 'Desk', terminal: 'Terminal', desktop: 'Desktop', garden: 'Jardim', foot: 'Gravuras do grigolin.org original.',
        build: 'Construir no vale', hint: 'Clique para construir', n: (n) => `${n} construídos`,
        toDark: 'Mudar para o tema escuro', toLight: 'Mudar para o tema claro', auto: 'seguindo o seu dispositivo', manual: 'escolhido por você. Clique de novo para seguir o dispositivo', dark: 'Escuro', light: 'Claro' },
};
let LANG = (() => { try { return JSON.parse(localStorage.getItem('lang')) === 'pt' ? 'pt' : 'en'; } catch { return 'en'; } })();
const t = (k, ...a) => { const v = I18N[LANG][k]; return typeof v === 'function' ? v(...a) : v; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const onLang = [];

/* the path that wasn't found (as text, never HTML) */
const path = document.getElementById('path');
const shown = (() => { try { return decodeURI(location.pathname); } catch { return location.pathname; } })().replace(/^\/+/, '');
const paintPath = () => { if (!shown) return; path.hidden = false; path.textContent = ''; path.append(t('path') + ' '); const b = document.createElement('b'); b.textContent = '/' + shown; path.append(b); };
onLang.push(paintPath);

function render() {
  document.documentElement.lang = LANG === 'pt' ? 'pt-BR' : 'en';
  document.querySelectorAll('[data-i]').forEach((el) => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll('[data-i-aria]').forEach((el) => el.setAttribute('aria-label', t(el.dataset.iAria)));
  document.querySelectorAll('#lang button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
  onLang.forEach((f) => { try { f(); } catch {} });
}
document.querySelectorAll('#lang button').forEach((b) => b.addEventListener('click', () => { LANG = b.dataset.lang; try { localStorage.setItem('lang', JSON.stringify(LANG)); } catch {} render(); }));

/* the valley: same sprite sheet and placement as the Desk tile, starting nearly empty */
(() => {
  const S = (w, h, x, y) => ({ w, h, x, y });
  const ents = [S(65, 23, 8, 12), S(31, 30, 93, 3), S(65, 32, 134, 7), S(62, 26, 217, 8), S(67, 39, 66, 44), S(55, 31, 144, 51), S(43, 27, 216, 49), S(37, 31, 93, 144), S(50, 33, 154, 142), S(63, 58, 82, 82), S(76, 56, 161, 82), S(71, 69, 1, 140), S(26, 30, 224, 167), S(30, 31, 282, 168), S(26, 34, 316, 166), S(68, 63, 344, 72), S(86, 85, 348, 135)];
  const lone = [S(26, 30, 224, 167), S(30, 31, 282, 168), S(26, 34, 316, 166)];   // a few trees: no one has built here yet
  const vl = document.getElementById('vl'), cnt = document.getElementById('vlc'); let n = 0;
  const put = (x, y, e = ents[Math.random() * ents.length | 0], built = true) => {
    const d = document.createElement('span');
    d.className = 'sp';
    Object.assign(d.style, { width: e.w + 'px', height: e.h + 'px', backgroundPosition: `-${e.x}px -${e.y}px`, left: (x - e.w / 4) + 'px', top: (y - e.h / 2) + 'px', zIndex: Math.round(y) });
    vl.appendChild(d); if (built) n++;
  };
  const label = () => { cnt.textContent = n ? t('n', n) : t('hint'); };
  const spot = (r) => [10 + Math.random() * (r.width - 40), r.height * .5 + Math.random() * r.height * .4];
  vl.addEventListener('click', (e) => {
    const r = vl.getBoundingClientRect();
    const [x, y] = e.detail ? [e.clientX - r.left, e.clientY - r.top] : spot(r);   // detail 0: keyboard (Enter/Space)
    put(x, y); label();
  });
  const seed = () => { const r = vl.getBoundingClientRect(); lone.forEach((e, k) => setTimeout(() => put(r.width * (.18 + k * .3) + Math.random() * 30, r.height * (.62 + Math.random() * .22), e, false), reduce ? 0 : 300 + k * 140)); };
  const img = new Image(); img.onload = seed; img.src = '/images/entities.png';
  onLang.push(label);
})();
render();

/* theme: auto (device) by default; a click flips light/dark, and flipping back to the device's choice returns to auto */
(() => {
  const root = document.documentElement, btn = document.getElementById('themeBtn'), mq = matchMedia('(prefers-color-scheme: dark)');
  const saved = () => { try { const v = localStorage.getItem('theme'); return v === 'light' || v === 'dark' ? v : null; } catch { return null; } };
  const device = () => (mq.matches ? 'dark' : 'light');
  const current = () => saved() || device();
  const paint = () => {
    const m = current(), auto = !saved();
    btn.dataset.auto = auto;
    btn.setAttribute('aria-label', m === 'dark' ? t('toLight') : t('toDark'));
    btn.title = `${t(m)}, ${auto ? t('auto') : t('manual')}`;
  };
  const set = (v) => { if (v) root.dataset.theme = v; else delete root.dataset.theme; try { v ? localStorage.setItem('theme', v) : localStorage.removeItem('theme'); } catch {} paint(); };
  btn.addEventListener('click', () => {
    const next = current() === 'dark' ? 'light' : 'dark', value = next === device() ? null : next;
    if (!document.startViewTransition || reduce) return set(value);
    const b = btn.getBoundingClientRect(), x = b.left + b.width / 2, y = b.top + b.height / 2;
    root.style.setProperty('--tx', x + 'px'); root.style.setProperty('--ty', y + 'px');
    root.style.setProperty('--tr', Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 'px');
    root.classList.add('theming');
    document.startViewTransition(() => set(value)).finished.finally(() => root.classList.remove('theming'));
  });
  mq.addEventListener('change', paint);
  addEventListener('storage', (e) => { if (e.key !== 'theme') return; const v = saved(); if (v) root.dataset.theme = v; else delete root.dataset.theme; paint(); });
  onLang.push(paint);
  paint();
})();
</script>
</body>
</html>
