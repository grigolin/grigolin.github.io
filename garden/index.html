<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garden · Guilherme Grigolin</title>
<link rel="canonical" href="https://grigolin.org/garden/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Guilherme Grigolin">
<meta property="og:image" content="https://grigolin.org/images/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Guilherme Grigolin — AI engineer in São Paulo">

<meta property="og:title" content="Garden · Guilherme Grigolin">
<meta property="og:url" content="https://grigolin.org/garden/">
<meta name="description" content="Links, reading and things Guilherme Grigolin finds interesting.">
<meta property="og:description" content="Links, reading and things Guilherme Grigolin finds interesting.">
<meta name="theme-color" content="#ececea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<script>/* saved theme before first paint (shared with the Desk and Terminal) */try{var th=localStorage.getItem('theme');if(th==='light'||th==='dark')document.documentElement.dataset.theme=th}catch(e){}</script>
<script>try{var l=localStorage.getItem('lang');if(l==='"pt"'||l==='pt')document.documentElement.lang='pt-BR'}catch(e){}</script>
<link rel="preload" href="../fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Geist (SIL OFL 1.1), self-hosted: one variable file covers weights 400–600 */
@font-face{font-family:Geist;font-style:normal;font-weight:100 900;font-display:swap;src:url(../fonts/geist-latin.woff2) format('woff2')}
/* Layout: one readable column in the Desk's palette; each section is a list of entries, newest first. */
:root{
  --bg:#ececea; --card:#f8f8f6; --well:#ececea; --fg:#1b1b1a; --mid:#686864; --faint:#a3a39e; --line:rgba(0,0,0,.07); --acc:#3a6df0; --leaf:#4f8a3c;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 1px 2px rgba(0,0,0,.05),0 6px 16px -8px rgba(0,0,0,.12);
  --sans:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d0d0d; --card:#171717; --well:#222221; --fg:#ededed; --mid:#8c8c8c; --faint:#5e5e5e; --line:rgba(255,255,255,.07); --acc:#7aa2ff; --leaf:#8cc777;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 6px 20px -8px rgba(0,0,0,.6); color-scheme:dark;
}}:root[data-theme=dark]{
  --bg:#0d0d0d; --card:#171717; --well:#222221; --fg:#ededed; --mid:#8c8c8c; --faint:#5e5e5e; --line:rgba(255,255,255,.07); --acc:#7aa2ff; --leaf:#8cc777;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 6px 20px -8px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:40px max(20px,env(safe-area-inset-right)) 96px max(20px,env(safe-area-inset-left))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--mid)}
.top a{display:inline-flex;align-items:center;gap:6px;transition:color .2s}
.top a:hover{color:var(--fg)}
.prefs{display:inline-flex;align-items:center;gap:8px}
.themebtn{all:unset;cursor:pointer;position:relative;width:28px;height:28px;border-radius:999px;display:grid;place-items:center;color:var(--mid);transition:background .2s,color .2s,transform .15s}
.themebtn:hover{background:var(--card);color:var(--fg)}
.themebtn:active{transform:scale(.9)}
.themebtn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.themebtn svg{grid-area:1/1;width:16px;height:16px;transition:transform .5s cubic-bezier(.2,.9,.25,1.08),opacity .25s}
.themebtn .moon{opacity:0;transform:rotate(-70deg) scale(.4)}
:root[data-theme=dark] .themebtn .sun{opacity:0;transform:rotate(70deg) scale(.4)}
:root[data-theme=dark] .themebtn .moon{opacity:1;transform:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .themebtn .sun{opacity:0;transform:rotate(70deg) scale(.4)}:root:not([data-theme=light]) .themebtn .moon{opacity:1;transform:none}}
.themebtn .auto{position:absolute;right:3px;bottom:3px;width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--bg);transform:scale(0);transition:transform .3s cubic-bezier(.2,.9,.25,1.08)}
.themebtn[data-auto="true"] .auto{transform:none}
html.theming::view-transition-old(root){animation:none}
html.theming::view-transition-new(root){animation:theme-reveal .6s cubic-bezier(.4,0,.2,1) both}
@keyframes theme-reveal{from{clip-path:circle(0 at var(--tx) var(--ty))}to{clip-path:circle(var(--tr) at var(--tx) var(--ty))}}
.seg{display:inline-flex;padding:2px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.seg button{all:unset;cursor:pointer;height:24px;min-width:34px;padding:0 9px;display:grid;place-items:center;border-radius:999px;font:500 12px/1 var(--sans);color:var(--mid);transition:color .2s,background .2s}
.seg button[aria-pressed="true"]{color:var(--fg);background:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--acc)}
header{position:relative;margin:56px 0 40px;padding-bottom:28px}
.trees{position:relative;height:56px;margin-bottom:18px}
.trees i{position:absolute;bottom:0;background:url(../images/entities.png) no-repeat;transform-origin:50% 100%;mix-blend-mode:multiply;animation:sprout .8s var(--ease) both;animation-delay:calc(var(--k) * 70ms)}
@keyframes sprout{from{transform:scale(var(--s)) translateY(8px);opacity:0}}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .trees i{filter:invert(.9);mix-blend-mode:screen;opacity:.8}}:root[data-theme=dark] .trees i{filter:invert(.9);mix-blend-mode:screen;opacity:.8}
h1{margin:0;font-size:34px;font-weight:600;letter-spacing:-.035em;line-height:1.1}
header p{margin:10px 0 0;color:var(--mid);font-size:17px;max-width:46ch;letter-spacing:-.01em;text-wrap:pretty}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}
nav.tabs a{height:30px;padding:0 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mid);transition:color .2s,transform .2s}
nav.tabs a:hover{color:var(--fg);transform:translateY(-1px)}
nav.tabs em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--mid);opacity:.8}
section{margin-top:44px;scroll-margin-top:24px}
section h2{margin:0 0 12px;font-size:13px;font-weight:500;color:var(--mid);display:flex;justify-content:space-between}
ol{list-style:none;margin:0;padding:0;border-radius:18px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
li a,li .item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:14px 18px;transition:background .2s}
li + li a,li + li .item{box-shadow:0 -1px 0 var(--line)}
li a:hover{background:color-mix(in srgb,var(--well) 70%,var(--card))}
.t{font-weight:500;letter-spacing:-.01em}
.src{color:var(--mid);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.n{grid-column:1/-1;color:var(--mid);font-size:14px;text-wrap:pretty}
.empty{padding:20px 18px;color:var(--mid);font-size:14px;display:flex;align-items:center;gap:10px}
.empty svg{width:16px;height:16px;color:var(--leaf);flex:none}
footer{margin-top:64px;color:var(--mid);font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@view-transition{navigation:auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="../" data-i="back">← grigolin.org</a>
    <div class="prefs">
    <button class="themebtn" id="themeBtn" type="button" aria-label="Theme"><svg class="sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.3M8 13.2v1.3M1.5 8h1.3M13.2 8h1.3M3.4 3.4l.9.9M11.7 11.7l.9.9M3.4 12.6l.9-.9M11.7 4.3l.9-.9"/></svg><svg class="moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 9.6A5.6 5.6 0 0 1 6.4 2.5a5.6 5.6 0 1 0 7.1 7.1z"/></svg><span class="auto" aria-hidden="true"></span></button>
    <div class="seg" id="lang" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true" aria-label="EN, English">EN</button><button type="button" data-lang="pt" aria-pressed="false" aria-label="PT, Português">PT</button></div>
    </div>
  </div>

  <header>
    <div class="trees" id="trees" aria-hidden="true"></div>
    <h1 data-i="title">Garden</h1>
    <p data-i="intro">A slowly growing collection of links, reading and things I find interesting. Nothing here is finished.</p>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </header>

  <main id="main"></main>
  <footer data-i="foot">Planted in São Paulo.</footer>
</div>

<script>
/* ------------------------------------------------------------------
   GARDEN — edit this list to add things. Newest first within a section.
   { title, url (optional), source (optional: site, author, year), note (optional, en/pt or a plain string) }
   Example:
   reading: [
     { title: 'Attention Is All You Need', url: 'https://arxiv.org/abs/1706.03762', source: 'Vaswani et al., 2017',
       note: { en: 'Where transformers started.', pt: 'Onde os transformers começaram.' } },
   ],
------------------------------------------------------------------ */
const GARDEN = {
  reading: [],
  links: [],
  tools: [],
  ideas: [],
};

const I18N = {
  en: { back: '← grigolin.org', title: 'Garden', intro: 'A slowly growing collection of links, reading and things I find interesting. Nothing here is finished.',
        foot: 'Planted in São Paulo.', empty: 'Nothing planted here yet.',
        reading: 'Reading', links: 'Links', tools: 'Tools', ideas: 'Ideas',
        toDark: 'Switch to dark theme', toLight: 'Switch to light theme', auto: 'following your device', manual: 'chosen by you. Click again to follow your device', dark: 'Dark', light: 'Light' },
  pt: { back: '← grigolin.org', title: 'Jardim', intro: 'Uma coleção que cresce devagar: links, leituras e coisas que acho interessantes. Nada aqui está pronto.',
        foot: 'Plantado em São Paulo.', empty: 'Nada plantado aqui ainda.',
        reading: 'Leituras', links: 'Links', tools: 'Ferramentas', ideas: 'Ideias',
        toDark: 'Mudar para o tema escuro', toLight: 'Mudar para o tema claro', auto: 'seguindo o seu dispositivo', manual: 'escolhido por você. Clique de novo para seguir o dispositivo', dark: 'Escuro', light: 'Claro' },
};
let LANG = (() => { try { return JSON.parse(localStorage.getItem('lang')) === 'pt' ? 'pt' : 'en'; } catch { return 'en'; } })();
const t = (k) => I18N[LANG][k];
const esc = (s) => String(s).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const txt = (v) => (v && typeof v === 'object' ? v[LANG] || v.en : v) || '';
const leaf = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13c0-6 4-10 10-10 0 6-4 10-10 10z"/><path d="M3 13 9 7"/></svg>';

function render() {
  document.documentElement.lang = LANG === 'pt' ? 'pt-BR' : 'en';
  document.querySelectorAll('[data-i]').forEach((el) => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll('#lang button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
  const keys = Object.keys(GARDEN);
  document.getElementById('tabs').innerHTML = keys.map((k) => `<a href="#${k}">${t(k)}<em>${GARDEN[k].length}</em></a>`).join('');
  document.getElementById('main').innerHTML = keys.map((k) => {
    const items = GARDEN[k];
    const body = items.length ? items.map((it) => {
      const inner = `<span class="t">${esc(txt(it.title))}${it.url ? ' ↗' : ''}</span><span class="src">${esc(txt(it.source))}</span>${it.note ? `<span class="n">${esc(txt(it.note))}</span>` : ''}`;
      return `<li>${it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="item">${inner}</div>`}</li>`;
    }).join('') : `<li class="empty">${leaf}${t('empty')}</li>`;
    return `<section id="${k}"><h2>${t(k)}</h2><ol>${body}</ol></section>`;
  }).join('');
}
document.querySelectorAll('#lang button').forEach((b) => b.addEventListener('click', () => { LANG = b.dataset.lang; try { localStorage.setItem('lang', JSON.stringify(LANG)); } catch {} render(); }));

// the same engraved trees as the Desk tile
const S = (w, h, x, y) => ({ w, h, x, y });
[S(71, 69, 1, 140), S(26, 30, 224, 167), S(63, 58, 82, 82), S(22, 33, 255, 168), S(30, 31, 282, 168), S(76, 56, 161, 82), S(26, 34, 316, 166), S(67, 63, 167, 215)].forEach((e, k) => {
  const i = document.createElement('i'), s = .62;
  Object.assign(i.style, { width: e.w + 'px', height: e.h + 'px', backgroundPosition: `-${e.x}px -${e.y}px`, left: (k * 11.5) + '%', transform: `scale(${s})`, '--s': s, '--k': k });
  document.getElementById('trees').appendChild(i);
});
render();

/* theme: auto (device) by default; a click flips light/dark, and flipping back to the device's choice returns to auto */
(() => {
  const root = document.documentElement, btn = document.getElementById('themeBtn'), mq = matchMedia('(prefers-color-scheme: dark)');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const saved = () => { try { const v = localStorage.getItem('theme'); return v === 'light' || v === 'dark' ? v : null; } catch { return null; } };
  const device = () => (mq.matches ? 'dark' : 'light');
  const current = () => saved() || device();
  const paint = () => {
    const m = current(), auto = !saved();
    btn.dataset.auto = auto;
    btn.setAttribute('aria-label', m === 'dark' ? t('toLight') : t('toDark'));
    btn.title = `${t(m)}, ${auto ? t('auto') : t('manual')}`;
  };
  const set = (v) => { if (v) root.dataset.theme = v; else delete root.dataset.theme; try { v ? localStorage.setItem('theme', v) : localStorage.removeItem('theme'); } catch {} paint(); };
  btn.addEventListener('click', () => {
    const next = current() === 'dark' ? 'light' : 'dark', value = next === device() ? null : next;
    if (!document.startViewTransition || reduce) return set(value);
    const b = btn.getBoundingClientRect(), x = b.left + b.width / 2, y = b.top + b.height / 2;
    root.style.setProperty('--tx', x + 'px'); root.style.setProperty('--ty', y + 'px');
    root.style.setProperty('--tr', Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 'px');
    root.classList.add('theming');
    document.startViewTransition(() => set(value)).finished.finally(() => root.classList.remove('theming'));
  });
  mq.addEventListener('change', paint);
  addEventListener('storage', (e) => { if (e.key !== 'theme') return; const v = saved(); if (v) root.dataset.theme = v; else delete root.dataset.theme; paint(); });
  document.querySelectorAll('#lang button').forEach((b) => b.addEventListener('click', paint));
  paint();
})();
</script>
</body>
</html>
