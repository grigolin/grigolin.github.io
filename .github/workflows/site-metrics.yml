name: Site metrics
# Weekly refresh of data/sites.json (Websites tile). See scripts/site-metrics.mjs.
on:
  schedule: [{ cron: '0 9 * * 1' }]   # Mondays 09:00 UTC
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: site-metrics, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/site-metrics.mjs
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      - name: Commit if changed
        run: |
          git diff --quiet data/sites.json && { echo "No change"; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Site metrics: $(jq -r .asOf data/sites.json)" data/sites.json
          git push
